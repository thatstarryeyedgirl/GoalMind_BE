services:
  - type: web
    name: goalmind-api
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn goalmind.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goalmind-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

databases:
  - name: goalmind-db
    databaseName: goalmind
    user: goalmind